<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="milan-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a271d"/>
      <stop offset="100%" stop-color="#190f09"/>
    </radialGradient>
    <linearGradient id="milan-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fee2cf"/>
      <stop offset="100%" stop-color="#f5c7a4"/>
    </linearGradient>
    <linearGradient id="milan-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241a15"/>
      <stop offset="100%" stop-color="#140e0b"/>
    </linearGradient>
    <!-- Tan & Brown Plaid Check Pattern -->
    <pattern id="plaid-pattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#b07d62"/>
      <line x1="0" y1="0" x2="16" y2="0" stroke="#8d5b45" stroke-width="2.5"/>
      <line x1="0" y1="8" x2="16" y2="8" stroke="#ebd6c8" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="0" y2="16" stroke="#8d5b45" stroke-width="2.5"/>
      <line x1="8" y1="0" x2="8" y2="16" stroke="#ebd6c8" stroke-width="1.2"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="url(#milan-bg)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Plaid Collared Shirt Body -->
  <path d="M48 195 C52 152, 75 140, 100 140 C125 140, 148 152, 152 195 Z" fill="url(#plaid-pattern)"/>
  <!-- Open Collar -->
  <path d="M80 142 L95 158 L100 148 L105 158 L120 142" fill="#8d5b45" stroke="#683d2a" stroke-width="1.5"/>
  <circle cx="100" cy="168" r="1.8" fill="#ffffff"/> <!-- Shirt button -->
  <circle cx="100" cy="182" r="1.8" fill="#ffffff"/>

  <!-- Neck -->
  <rect x="88" y="116" width="24" height="28" rx="4" fill="url(#milan-skin)"/>

  <!-- Head -->
  <ellipse cx="100" cy="94" rx="35" ry="41" fill="url(#milan-skin)"/>

  <!-- Eyes -->
  <ellipse cx="85" cy="89" rx="5" ry="3.5" fill="#2d1c14"/>
  <ellipse cx="115" cy="89" rx="5" ry="3.5" fill="#2d1c14"/>
  <circle cx="86.5" cy="87.5" r="1.5" fill="#ffffff"/>
  <circle cx="116.5" cy="87.5" r="1.5" fill="#ffffff"/>

  <!-- Left Eyebrow with Signature Slit! -->
  <path d="M78 81 L86 79" stroke="#241a15" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Slit Gap -->
  <path d="M89 80 L93 82" stroke="#241a15" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right Eyebrow -->
  <path d="M107 82 Q115 79 122 81" fill="none" stroke="#241a15" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M100 90 L96 99 L104 99" fill="none" stroke="#d99f7d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Milan's Trimmed Mustache & Goatee Beard -->
  <g>
    <!-- Mustache -->
    <path d="M92 105 Q100 103 108 105 Q104 108 100 107 Q96 108 92 105 Z" fill="#241a15"/>
    <!-- Subtle Lips -->
    <path d="M94 110 Q100 112 106 110" fill="none" stroke="#c06050" stroke-width="1.8"/>
    <!-- Goatee / Chin Beard -->
    <path d="M93 116 Q100 126 107 116 Q104 128 100 131 Q96 128 93 116 Z" fill="#241a15"/>
    <!-- Trimmed Stubble Along Jaw -->
    <path d="M72 106 Q100 138 128 106" fill="none" stroke="#241a15" stroke-width="2.5" stroke-dasharray="2,3" opacity="0.6"/>
  </g>

  <!-- Textured Dark Crop Hair with Fade -->
  <path d="M66 85 C64 56, 75 42, 100 42 C125 42, 136 56, 134 85 C130 68, 122 62, 100 62 C78 62, 70 68, 66 85 Z" fill="url(#milan-hair)"/>
  <!-- Front Fringe / Texture -->
  <path d="M76 64 Q85 68 94 62 Q102 68 112 63 Q120 66 126 64" fill="none" stroke="#241a15" stroke-width="3" stroke-linecap="round"/>
</svg>
