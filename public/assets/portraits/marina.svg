<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="marina-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d3420"/>
      <stop offset="100%" stop-color="#1c160c"/>
    </radialGradient>
    <linearGradient id="marina-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fee5d3"/>
      <stop offset="100%" stop-color="#f8cfb2"/>
    </linearGradient>
    <linearGradient id="marina-hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3825"/>
      <stop offset="100%" stop-color="#341f13"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="url(#marina-bg)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Flowing Hair Behind -->
  <path d="M48 85 C32 125, 38 185, 68 195 L132 195 C162 185, 168 125, 152 85 Z" fill="url(#marina-hair)"/>

  <!-- Cozy Cream Knit Sweater (Chunky texture lines) -->
  <path d="M48 195 C52 152, 75 140, 100 140 C125 140, 148 152, 152 195 Z" fill="#f4ede2"/>
  <path d="M72 150 C80 155, 120 155, 128 150" fill="none" stroke="#e0d5c1" stroke-width="3"/>
  <path d="M60 170 Q100 178 140 170" fill="none" stroke="#e0d5c1" stroke-width="2.5"/>
  <path d="M55 190 Q100 198 145 190" fill="none" stroke="#e0d5c1" stroke-width="2.5"/>

  <!-- Neck -->
  <rect x="88" y="116" width="24" height="28" rx="6" fill="url(#marina-skin)"/>

  <!-- Head -->
  <ellipse cx="100" cy="94" rx="36" ry="42" fill="url(#marina-skin)"/>

  <!-- Joyful Smile / Laughing Expression -->
  <path d="M86 112 Q100 126 114 112 Z" fill="#c93b53"/>
  <path d="M88 113 Q100 119 112 113" fill="#ffffff"/> <!-- Bright teeth smile -->

  <!-- Joyful Eyes -->
  <ellipse cx="85" cy="89" rx="5" ry="4" fill="#2d1c14"/>
  <ellipse cx="115" cy="89" rx="5" ry="4" fill="#2d1c14"/>
  <circle cx="86.5" cy="87.5" r="1.8" fill="#ffffff"/>
  <circle cx="116.5" cy="87.5" r="1.8" fill="#ffffff"/>

  <!-- Cheerful Eyebrows -->
  <path d="M78 80 Q85 76 92 80" fill="none" stroke="#3d2617" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M108 80 Q115 76 122 80" fill="none" stroke="#3d2617" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M100 92 L96 99 L104 99" fill="none" stroke="#d99f7d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Warm Rosy Cheeks -->
  <ellipse cx="76" cy="100" rx="9" ry="5.5" fill="#ff70a6" opacity="0.4"/>
  <ellipse cx="124" cy="100" rx="9" ry="5.5" fill="#ff70a6" opacity="0.4"/>

  <!-- Hair in Front with Waves -->
  <path d="M58 85 C52 48, 75 38, 100 38 C125 38, 148 48, 142 85 C132 66, 120 60, 100 62 C80 60, 68 66, 58 85 Z" fill="url(#marina-hair)"/>
  <path d="M56 85 C52 110, 64 135, 70 150 C62 130, 56 108, 56 85 Z" fill="url(#marina-hair)"/>
  <path d="M144 85 C148 110, 136 135, 130 150 C138 130, 144 108, 144 85 Z" fill="url(#marina-hair)"/>
</svg>
